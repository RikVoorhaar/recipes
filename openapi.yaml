openapi: 3.1.0
info:
  title: Recipe App API
  version: 1.0.0
  description: >
    Authenticated recipe authoring API. Every API read and write requires a
    bearer token except the OpenAPI document. /health is also public.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/openapi.yaml:
    get:
      security: []
      summary: Get this OpenAPI document
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema: { type: string }
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/v1/guidelines:
    get:
      summary: Get recipe-writing guidelines
      responses:
        "200":
          $ref: "#/components/responses/Guidelines"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/drafts:
    get:
      summary: List private drafts owned by the bearer token
      responses:
        "200": { description: Owned drafts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Draft" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create or revise an owner-private draft
      description: Existing drafts require expected_revision. Incomplete document objects are accepted. Set recipe_id to start from the current published recipe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftWrite" }
      responses:
        "200": { description: Revised draft, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "201": { description: New draft, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/drafts/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Read an owned private draft
      responses:
        "200": { description: Draft, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Discard an owned draft with revision check
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpectedDraftRevision" } } }
      responses:
        "204": { description: Discarded }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/drafts/{id}/publish:
    post:
      summary: Validate and atomically publish a draft
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpectedDraftRevision" } } }
      responses:
        "200": { $ref: "#/components/responses/SaveResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/recipes:
    get:
      summary: List current non-deleted recipes
      responses:
        "200":
          $ref: "#/components/responses/RecipeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a recipe
      description: >
        Read the writing guidelines first. Cooklang metadata (YAML front matter
        and legacy `>>` metadata) is rejected; use structured fields instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeWrite" }
      responses:
        "201":
          $ref: "#/components/responses/SaveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/recipes/{id}/scaled:
    get:
      summary: Render the current recipe for a requested servings count
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: servings, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Shared scaled recipe view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScaledRecipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/recipes/{id}/pdf:
    get:
      summary: Download the scaled recipe as a one-page A4 PDF
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: servings, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Deterministic PDF with bundled fonts
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/recipes/validate:
    post:
      summary: Dry-run Cooklang parsing, ingredient resolution and servings scaling
      description: >
        Performs no writes. Includes print-fit status and the chosen font size;
        non-fitting recipes report does_not_fit with a null font size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, servings, body]
              properties:
                title: { type: string }
                description: { type: string }
                servings: { type: integer, minimum: 1 }
                tags: { type: array, items: { type: string } }
                notes: { type: [string, "null"] }
                source_url: { type: [string, "null"], format: uri }
                image_ref: { type: [string, "null"] }
                body: { type: string }
                target_servings: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Parsed recipe, non-mutating resolution preview, and print-fit status
          content:
            application/json:
              schema:
                type: object
                required: [ingredients, resolutions, warnings, print_fit]
                properties:
                  ingredients: { type: array, items: { type: object } }
                  resolutions: { type: array, items: { type: object } }
                  warnings: { type: array, items: { type: string } }
                  print_fit:
                    type: object
                    required: [fits, font_size_pt, status, minimum_font_size_pt]
                    properties:
                      fits: { type: boolean }
                      font_size_pt: { type: [integer, "null"], minimum: 8, maximum: 11 }
                      status: { type: string, enum: [fits, does_not_fit] }
                      minimum_font_size_pt: { type: integer, const: 8 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /recipes/{id}.pdf:
    get:
      security: []
      summary: Download the public recipe as a one-page A4 PDF
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: servings, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Deterministic PDF with bundled fonts
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/ingredients:
    get:
      summary: List canonical ingredients and current non-deleted recipe usage counts
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        "200":
          description: Canonical ingredient summaries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/IngredientSummary" } }
  /api/v1/ingredients/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get an ingredient, aliases, linked current recipes, and usage count
      responses:
        "200":
          description: Ingredient and linked recipes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngredientDetail" }
    put:
      summary: Rename a canonical ingredient (does not create recipe revisions)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameBody" }
      responses:
        "204": { description: Renamed }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ingredients/{id}/aliases:
    post:
      summary: Add a unique alias to an ingredient
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasBody" }
      responses:
        "201": { description: Alias added }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ingredients/{id}/aliases/{alias}:
    delete:
      summary: Remove an ingredient alias
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: alias, required: true, schema: { type: string } }
      responses:
        "204": { description: Alias removed }
  /api/v1/ingredients/{id}/merge:
    post:
      summary: Merge this ingredient into a survivor selected by ID, canonical name, or alias
      description: >
        The source is retained as a redirecting deleted record. Its canonical
        name keeps resolving through that redirect independently of aliases;
        self-merge is rejected after resolving the survivor.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeBody" }
      responses:
        "204": { description: Merged; source remains as a redirecting record }
  /api/v1/tags:
    get:
      summary: List tags with counts among current non-deleted recipes
      responses:
        "200":
          description: Tag counts
          content:
            application/json:
              schema: { type: array, items: { type: object, required: [tag, count], properties: { tag: { type: string }, count: { type: integer } } } }
  /api/v1/search:
    get:
      summary: Composable structured recipe search
      description: >
        Comma-separated canonical ingredient IDs/names (registered aliases accepted),
        tags and exclusions. Raw occurrence wording is not a filter identity.
        ingredient_mode and tag_mode accept all or any. Pagination defaults to
        limit 50 and offset 0; limit is capped at 200. Sort is title, updated or relevance.
        has_image filters according to the current revision's image attachment.
        `updated_since` is parsed as RFC3339 and compared as an instant.
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: ingredients, schema: { type: string } }
        - { in: query, name: ingredient_mode, schema: { type: string, enum: [all, any] } }
        - { in: query, name: exclude_ingredients, schema: { type: string } }
        - { in: query, name: tags, schema: { type: string } }
        - { in: query, name: tag_mode, schema: { type: string, enum: [all, any] } }
        - { in: query, name: exclude_tags, schema: { type: string } }
        - { in: query, name: min_servings, schema: { type: integer, minimum: 1 } }
        - { in: query, name: max_servings, schema: { type: integer, minimum: 1 } }
        - { in: query, name: has_image, schema: { type: boolean } }
        - { in: query, name: include_deleted, schema: { type: boolean, default: false } }
        - { in: query, name: updated_since, schema: { type: string, format: date-time } }
        - { in: query, name: sort, schema: { type: string, enum: [relevance, title, updated], default: title } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Search results
          content:
            application/json:
                schema: { type: array, items: { $ref: "#/components/schemas/SearchResult" } }
  /api/v1/images:
    post:
      summary: Upload and normalize an image
      description: >
        Authenticated raw JPEG, PNG, or WebP upload, maximum 10 MiB. Declared
        MIME type must match decoded format. Decoding is limited to 8192 pixels
        per dimension, 64 MiB per decoder allocation, and 16 megapixels total.
        The image is resized to fit within 1600x1600 and re-encoded as JPEG.
        The returned ref is opaque and may be attached to a recipe.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded normalized image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedImage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Upload exceeds the 10 MiB body limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /images/{ref}:
    get:
      security: []
      summary: Retrieve an image by opaque reference
      parameters:
        - { in: path, name: ref, required: true, schema: { type: string } }
      responses:
        "200":
          description: Normalized JPEG bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/recipes/{id}/image:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Attach or replace the current recipe image
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachImage" }
      responses:
        "200": { $ref: "#/components/responses/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Detach the current recipe image without deleting stored bytes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaseRevision" }
      responses:
        "200": { $ref: "#/components/responses/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/recipes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get current recipe, including deleted recipes
      responses:
        "200":
          $ref: "#/components/responses/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Update current recipe
      description: >
        Requires base_revision. A stale revision returns 409 with the current
        revision ID, even if the proposed Cooklang body is invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeUpdate" }
      responses:
        "200":
          $ref: "#/components/responses/SaveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Soft delete a recipe (JSON body requires base_revision)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaseRevision" }
      responses:
        "200":
          $ref: "#/components/responses/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/recipes/{id}/restore:
    post:
      summary: Restore a soft-deleted recipe as a new revision
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaseRevision" }
      responses:
        "200":
          $ref: "#/components/responses/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/recipes/{id}/revisions:
    get:
      summary: List immutable recipe revisions by stored timestamp ascending, then revision ID ascending
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          $ref: "#/components/responses/RecipeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/recipes/{id}/revisions/{revision}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: revision, required: true, schema: { type: string } }
    get:
      summary: Get a historical revision
      responses:
        "200":
          $ref: "#/components/responses/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Restore a historical revision as a new current revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaseRevision" }
      responses:
        "200":
          $ref: "#/components/responses/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    DraftWrite:
      type: object
      required: [document]
      properties:
        id: { type: string }
        expected_revision: { type: integer, minimum: 1 }
        recipe_id: { type: string, description: Start an edit from this recipe's current revision }
        document: { type: object, additionalProperties: true }
    ExpectedDraftRevision:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 1 }
    Draft:
      type: object
      required: [id, revision, document, updated_at]
      properties:
        id: { type: string }
        revision: { type: integer }
        base_recipe_id: { type: [string, "null"] }
        base_revision: { type: [string, "null"] }
        document: { type: object, additionalProperties: true }
        updated_at: { type: string, format: date-time }
    NameBody:
      type: object
      required: [name]
      properties:
        name: { type: string }
    AliasBody:
      type: object
      required: [alias]
      properties:
        alias: { type: string }
    MergeBody:
      type: object
      required: [survivor]
      properties:
        survivor:
          type: string
          description: Canonical ID, canonical name, or registered alias of the survivor
    IngredientSummary:
      type: object
      required: [id, name, usage_count]
      properties:
        id: { type: string }
        name: { type: string }
        usage_count: { type: integer }
    IngredientDetail:
      allOf:
        - { $ref: "#/components/schemas/IngredientSummary" }
        - type: object
          properties:
            aliases: { type: array, items: { type: string } }
            recipe_ids: { type: array, items: { type: string } }
    SearchResult:
      type: object
      required: [id, title, tags, matched_ingredients, snippet]
      properties:
        id: { type: string }
        title: { type: string }
        tags: { type: array, items: { type: string } }
        matched_ingredients: { type: array, items: { type: string } }
        snippet: { type: string }
    ScaledRecipe:
      type: object
      required: [id, title, description, base_servings, servings, tags, image, ingredients, instructions, notes, source_url]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        base_servings: { type: integer }
        servings: { type: integer }
        tags: { type: array, items: { type: string } }
        image: { oneOf: [{ $ref: "#/components/schemas/ImageReference" }, { type: "null" }] }
        ingredients: { type: array, items: { type: object, required: [name, quantity, note], properties: { name: { type: string }, quantity: { type: [string, "null"] }, note: { type: [string, "null"] } } } }
        instructions: { type: array, items: { type: string } }
        notes: { type: [string, "null"] }
        source_url: { type: [string, "null"] }
    UploadedImage:
      type: object
      required: [ref, url]
      properties:
        ref: { type: string, description: Opaque image reference }
        url: { type: string, description: Backend-independent public image URL }
    ImageReference:
      type: object
      required: [ref, url]
      properties:
        ref: { type: string }
        url: { type: string }
    AttachImage:
      type: object
      required: [base_revision, image_ref]
      properties:
        base_revision: { type: string }
        image_ref: { type: string }
    RecipeWrite:
      type: object
      required: [title, servings, body]
      properties:
        title: { type: string }
        description: { type: string, default: "" }
        servings: { type: integer, minimum: 1 }
        tags:
          type: array
          items: { type: string }
        source_url: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        body: { type: string, description: Cooklang body without metadata }
    RecipeUpdate:
      allOf:
        - { $ref: "#/components/schemas/RecipeWrite" }
        - type: object
          required: [base_revision]
          properties:
            base_revision:
              type: string
              description: Revision ID on which the client based this update
    BaseRevision:
      type: object
      required: [base_revision]
      properties:
        base_revision: { type: string }
    RecipeDocument:
      type: object
      required:
        - id
        - revision
        - revision_created_at
        - title
        - description
        - servings
        - tags
        - source_url
        - notes
        - body
        - deleted
        - image
        - author_label
      properties:
        id: { type: string, description: Stable recipe ID }
        revision: { type: string, description: Immutable revision ID }
        revision_created_at: { type: string, format: date-time }
        title: { type: string }
        description: { type: string }
        servings: { type: integer, minimum: 1 }
        tags:
          type: array
          items: { type: string }
        source_url: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        body: { type: string }
        deleted: { type: boolean }
        image: { oneOf: [{ $ref: "#/components/schemas/ImageReference" }, { type: "null" }] }
        author_label: { type: string }
    SaveResult:
      type: object
      required: [recipe, warnings]
      properties:
        recipe: { $ref: "#/components/schemas/RecipeDocument" }
        warnings:
          type: array
          description: Cooklang parser warnings; empty if none
          items: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_json
            - invalid_image
            - payload_too_large
            - invalid_request
            - cooklang_invalid
            - cooklang_metadata_forbidden
            - unauthorized
            - not_found
            - conflict
            - internal_error
        message: { type: string }
        current_revision_id:
          type: string
          description: Included for revision conflicts when a current recipe exists
        diagnostics:
          type: array
          description: Cooklang parser diagnostics when parsing fails
          items:
            type: object
            required: [line, column, message]
            properties:
              line: { type: integer, minimum: 1 }
              column: { type: integer, minimum: 1 }
              message: { type: string }
  responses:
    Guidelines:
      description: Writing guidelines as Markdown
      content:
        text/markdown:
          schema: { type: string }
    Recipe:
      description: Recipe or immutable revision document
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecipeDocument" }
    RecipeList:
      description: Recipe or revision documents
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/RecipeDocument" }
    SaveResult:
      description: Saved recipe and Cooklang warnings
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SaveResult" }
    BadRequest:
      description: Malformed, incomplete, schema-invalid, or content-type-invalid JSON request body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recipe or revision does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Stale base revision
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid request fields, Cooklang parse error, or forbidden metadata
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Request could not be completed due to an internal error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
